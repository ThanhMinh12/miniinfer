name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  avx2:
    name: AVX2 / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure AVX2 build
        run: >-
          cmake -S . -B build-avx2
          -DCMAKE_BUILD_TYPE=Release
          -DMINIINFER_ENABLE_AVX2=ON

      - name: Build
        run: cmake --build build-avx2 --parallel 2

      - name: Test
        run: ctest --test-dir build-avx2 --output-on-failure
